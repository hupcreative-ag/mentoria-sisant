<!DOCTYPE html>
<html lang="pt-BR" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta | Dr. Gustavo Sisant</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1a273c">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg">
    <link rel="alternate icon" type="image/png" href="./assets/images/Logo_Compacta_preta.png">

    <!-- Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons: Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#1a273c',
                        'blue-medium': '#2167b0',
                        beige: '#957854',
                        'beige-light': '#e7e0d0',
                        'gray-light': '#f8f8f8',
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    boxShadow: {
                        'premium': '0 4px 20px rgba(0,0,0,0.05)',
                        'premium-hover': '0 8px 30px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>
</head>

<body class="font-sans min-h-full bg-gray-light flex flex-col justify-between">
    
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 py-4 px-4 sm:px-6 lg:px-8 shadow-sm">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <a href="/">
                <img class="h-10 w-auto object-contain" src="assets/images/Logo_Horizontal_Preta.png" alt="Dr. Gustavo Sisant">
            </a>
            
            <div class="flex items-center gap-4">
                <span id="user-display-name" class="hidden sm:inline text-sm font-medium text-navy">Carregando...</span>
                <button id="btn-logout" class="flex items-center gap-1.5 px-3 py-1.5 border border-red-200 text-red-600 hover:bg-red-50 rounded-lg text-xs font-semibold transition-all">
                    <i class="ph ph-sign-out text-sm"></i> Sair
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl w-full mx-auto py-10 px-4 sm:px-6 lg:px-8">
        
        <!-- Welcome Card -->
        <div class="bg-navy text-white p-8 rounded-2xl shadow-premium mb-8 relative overflow-hidden">
            <div class="relative z-10">
                <span class="bg-blue-medium/30 text-blue-300 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider">Painel do Aluno</span>
                <h1 class="text-2xl sm:text-3xl font-bold mt-2" id="welcome-title">Olá, carrgando seu perfil...</h1>
                <p class="text-sm text-gray-300 mt-1">Gerencie seus dados de acesso e informações de contato.</p>
            </div>
            <!-- Decorative circle -->
            <div class="absolute right-0 top-0 w-48 h-48 bg-blue-medium opacity-20 rounded-full translate-x-20 -translate-y-20 blur-2xl"></div>
        </div>

        <!-- Alert Container -->
        <div id="alert-container" class="hidden mb-6 p-4 rounded-xl border text-sm flex items-start gap-3">
            <i id="alert-icon" class="ph-bold text-lg mt-0.5"></i>
            <div id="alert-message" class="flex-1"></div>
        </div>

        <!-- Profile Tabs -->
        <div class="flex flex-col md:flex-row gap-8">
            
            <!-- Sidebar Navigation -->
            <aside class="w-full md:w-1/4">
                <nav class="space-y-1 bg-white p-4 rounded-xl shadow-premium border border-beige-light/30">
                    <button id="nav-btn-data" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold transition-all bg-blue-medium/10 text-blue-medium">
                        <i class="ph ph-user-circle text-lg"></i> Meus Dados
                    </button>
                    <button id="nav-btn-security" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold transition-all text-gray-500 hover:text-navy hover:bg-gray-50">
                        <i class="ph ph-lock text-lg"></i> Segurança
                    </button>
                </nav>
            </aside>

            <!-- Card Content Area -->
            <section class="w-full md:w-3/4 bg-white p-6 sm:p-8 rounded-2xl shadow-premium border border-beige-light/30">
                
                <!-- Section 1: MEUS DADOS -->
                <div id="section-data" class="space-y-6">
                    <h2 class="text-xl font-bold text-navy border-b border-gray-100 pb-3">Informações Pessoais</h2>
                    
                    <form id="form-profile-data" class="space-y-5">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div>
                                <label for="profile-name" class="block text-sm font-medium text-navy">Nome Completo</label>
                                <input type="text" id="profile-name" required
                                    class="mt-1 block w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-medium focus:border-blue-medium text-gray-900 transition-all">
                            </div>
                            
                            <div>
                                <label for="profile-phone" class="block text-sm font-medium text-navy">Telefone / WhatsApp</label>
                                <input type="tel" id="profile-phone" required
                                    class="mt-1 block w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-medium focus:border-blue-medium text-gray-900 transition-all">
                            </div>
                        </div>

                        <div>
                            <label for="profile-email" class="block text-sm font-medium text-navy">E-mail de Acesso</label>
                            <input type="email" id="profile-email" disabled
                                class="mt-1 block w-full bg-gray-100 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-500 cursor-not-allowed">
                            <span class="text-xs text-gray-400 mt-1 block">Para alterar seu e-mail de cadastro, entre em contato com o suporte.</span>
                        </div>

                        <div class="flex justify-end pt-4">
                            <button type="submit" id="btn-save-data"
                                class="flex items-center gap-2 py-3 px-6 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-blue-medium hover:bg-navy focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-medium transition-all duration-300">
                                <i class="ph ph-floppy-disk text-lg"></i> Salvar Alterações
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Section 2: SEGURANÇA (Alterar Senha) -->
                <div id="section-security" class="space-y-6 hidden">
                    <h2 class="text-xl font-bold text-navy border-b border-gray-100 pb-3">Alterar Minha Senha</h2>
                    
                    <form id="form-profile-security" class="space-y-5">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div>
                                <label for="security-password" class="block text-sm font-medium text-navy">Nova Senha</label>
                                <div class="mt-1 relative rounded-md shadow-sm">
                                    <input type="password" id="security-password" required minlength="6"
                                        class="block w-full border border-gray-300 rounded-xl pl-4 pr-10 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-medium focus:border-blue-medium text-gray-900 transition-all"
                                        placeholder="Mínimo 6 caracteres">
                                    <button type="button" class="btn-toggle-password absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-navy">
                                        <i class="ph ph-eye"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div>
                                <label for="security-password-confirm" class="block text-sm font-medium text-navy">Confirmar Nova Senha</label>
                                <div class="mt-1 relative rounded-md shadow-sm">
                                    <input type="password" id="security-password-confirm" required minlength="6"
                                        class="block w-full border border-gray-300 rounded-xl pl-4 pr-10 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-medium focus:border-blue-medium text-gray-900 transition-all"
                                        placeholder="Confirme sua nova senha">
                                    <button type="button" class="btn-toggle-password absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-navy">
                                        <i class="ph ph-eye"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-end pt-4">
                            <button type="submit" id="btn-save-password"
                                class="flex items-center gap-2 py-3 px-6 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-blue-medium hover:bg-navy focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-medium transition-all duration-300">
                                <i class="ph ph-shield-check text-lg"></i> Atualizar Senha
                            </button>
                        </div>
                    </form>
                </div>

            </section>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 px-4 text-center text-xs text-gray-400">
        <p>&copy; 2026 Dr. Gustavo Sisant. Todos os direitos reservados.</p>
    </footer>

    <!-- App Script -->
    <script type="module" src="./perfil.js"></script>
</body>

</html>
