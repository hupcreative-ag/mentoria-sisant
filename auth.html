<!DOCTYPE html>
<html lang="pt-BR" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Aluno | Dr. Gustavo Sisant</title>
    <meta name="description" content="Acesse a plataforma de mentoria do Dr. Gustavo Sisant. Realize seu login ou faça seu cadastro.">
    <meta name="theme-color" content="#1a273c">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg">
    <link rel="alternate icon" type="image/png" href="./assets/images/Logo_Compacta_preta.png">

    <!-- Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons: Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#1a273c',
                        'blue-medium': '#2167b0',
                        beige: '#957854',
                        'beige-light': '#e7e0d0',
                        'gray-light': '#f8f8f8',
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    boxShadow: {
                        'premium': '0 4px 20px rgba(0,0,0,0.05)',
                        'premium-hover': '0 8px 30px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>
</head>

<body class="font-sans min-h-full bg-gray-light flex flex-col justify-between py-12 sm:px-6 lg:px-8">
    
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <!-- Logo -->
        <a href="/" class="inline-block">
            <img class="mx-auto h-12 w-auto object-contain" src="assets/images/Logo_Horizontal_Preta.png" alt="Dr. Gustavo Sisant">
        </a>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4">
        <div class="bg-white py-8 px-6 shadow-premium rounded-2xl border border-beige-light/30 sm:px-10">
            
            <!-- Alert Container for notifications -->
            <div id="alert-container" class="hidden mb-6 p-4 rounded-xl border text-sm flex items-start gap-3">
                <i id="alert-icon" class="ph-bold text-lg mt-0.5"></i>
                <div id="alert-message" class="flex-1"></div>
            </div>

            <!-- TAB HEADERS (Only visible in normal Auth state) -->
            <div id="auth-tabs" class="flex border-b border-gray-200 mb-8">
                <button id="tab-login" class="w-1/2 pb-4 text-center font-medium text-lg border-b-2 border-blue-medium text-blue-medium transition-all">
                    Entrar
                </button>
                <button id="tab-register" class="w-1/2 pb-4 text-center font-medium text-lg border-b-2 border-transparent text-gray-500 hover:text-navy transition-all">
                    Cadastrar
                </button>
            </div>

            <!-- 1. LOGIN FORM -->
            <form id="form-login" class="space-y-6">
                <div>
                    <label for="login-email" class="block text-sm font-medium text-navy">E-mail</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="ph ph-envelope"></i>
                        </div>
                        <input id="login-email" name="email" type="email" autocomplete="email" required 
                            class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-medium focus:border-blue-medium text-sm transition-all" 
                            placeholder="seuemail@exemplo.com">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center">
                        <label for="login-password" class="block text-sm font-medium text-navy">Senha</label>
                        <button type="button" id="btn-goto-recovery" class="text-xs font-semibold text-blue-medium hover:underline focus:outline-none">
                            Esqueceu a senha?
                        </button>
                    </div>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="ph ph-lock"></i>
                        </div>
                        <input id="login-password" name="password" type="password" autocomplete="current-password" required 
                            class="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-medium focus:border-blue-medium text-sm transition-all" 
                            placeholder="••••••••">
                        <button type="button" class="btn-toggle-password absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-navy">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <button type="submit" id="btn-login-submit"
                        class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-blue-medium hover:bg-navy focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-medium transition-all duration-300">
                        Acessar Plataforma
                    </button>
                </div>
            </form>

            <!-- 2. REGISTER FORM -->
            <form id="form-register" class="space-y-6 hidden">
                <div>
                    <label for="register-name" class="block text-sm font-medium text-navy">Nome Completo</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="ph ph-user"></i>
                        </div>
                        <input id="register-name" name="name" type="text" required 
                            class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-medium focus:border-blue-medium text-sm transition-all" 
                            placeholder="Dr(a). Seu Nome Completo">
                    </div>
                </div>

                <div>
                    <label for="register-phone" class="block text-sm font-medium text-navy">Telefone / WhatsApp</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="ph ph-phone"></i>
                        </div>
                        <input id="register-phone" name="phone" type="tel" required 
                            class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-medium focus:border-blue-medium text-sm transition-all" 
                            placeholder="(11) 99999-9999">
                    </div>
                </div>

                <div>
                    <label for="register-email" class="block text-sm font-medium text-navy">E-mail</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="ph ph-envelope"></i>
                        </div>
                        <input id="register-email" name="email" type="email" autocomplete="email" required 
                            class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-medium focus:border-blue-medium text-sm transition-all" 
                            placeholder="seuemail@exemplo.com">
                    </div>
                </div>

                <div>
                    <label for="register-password" class="block text-sm font-medium text-navy">Senha</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="ph ph-lock"></i>
                        </div>
                        <input id="register-password" name="password" type="password" required 
                            class="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-medium focus:border-blue-medium text-sm transition-all" 
                            placeholder="Mínimo 6 caracteres">
                        <button type="button" class="btn-toggle-password absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-navy">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="register-password-confirm" class="block text-sm font-medium text-navy">Confirmar Senha</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="ph ph-lock-key"></i>
                        </div>
                        <input id="register-password-confirm" name="password-confirm" type="password" required 
                            class="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-medium focus:ring-offset-2 focus:ring-blue-medium text-sm transition-all" 
                            placeholder="Confirme sua senha">
                        <button type="button" class="btn-toggle-password absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-navy">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <button type="submit" id="btn-register-submit"
                        class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-blue-medium hover:bg-navy focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-medium transition-all duration-300">
                        Criar Minha Conta
                    </button>
                </div>
            </form>

            <!-- 3. PASSWORD RECOVERY FORM -->
            <form id="form-recovery" class="space-y-6 hidden">
                <div class="text-center mb-4">
                    <h2 class="text-xl font-bold text-navy">Recuperar Senha</h2>
                    <p class="text-xs text-gray-500 mt-1">Informe seu e-mail cadastrado para receber o link de redefinição de senha.</p>
                </div>

                <div>
                    <label for="recovery-email" class="block text-sm font-medium text-navy">E-mail</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="ph ph-envelope"></i>
                        </div>
                        <input id="recovery-email" name="email" type="email" required 
                            class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-medium focus:border-blue-medium text-sm transition-all" 
                            placeholder="seuemail@exemplo.com">
                    </div>
                </div>

                <div>
                    <button type="submit" id="btn-recovery-submit"
                        class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-blue-medium hover:bg-navy focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-medium transition-all duration-300">
                        Enviar Link de Recuperação
                    </button>
                </div>

                <div class="text-center mt-4">
                    <button type="button" id="btn-recovery-back" class="text-xs font-semibold text-blue-medium hover:underline focus:outline-none">
                        <i class="ph ph-arrow-left inline-block mr-1 align-middle"></i> Voltar para o Login
                    </button>
                </div>
            </form>

            <!-- 4. PASSWORD RESET FORM (Visible only when recovery token detected) -->
            <form id="form-reset-password" class="space-y-6 hidden">
                <div class="text-center mb-4">
                    <h2 class="text-xl font-bold text-navy">Definir Nova Senha</h2>
                    <p class="text-xs text-gray-500 mt-1">Digite sua nova senha de acesso abaixo.</p>
                </div>

                <div>
                    <label for="reset-password" class="block text-sm font-medium text-navy">Nova Senha</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="ph ph-lock"></i>
                        </div>
                        <input id="reset-password" name="password" type="password" required 
                            class="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-medium focus:border-blue-medium text-sm transition-all" 
                            placeholder="Mínimo 6 caracteres">
                        <button type="button" class="btn-toggle-password absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-navy">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="reset-password-confirm" class="block text-sm font-medium text-navy">Confirmar Nova Senha</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="ph ph-lock-key"></i>
                        </div>
                        <input id="reset-password-confirm" name="password-confirm" type="password" required 
                            class="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-medium focus:border-blue-medium text-sm transition-all" 
                            placeholder="Confirme sua nova senha">
                        <button type="button" class="btn-toggle-password absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-navy">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <button type="submit" id="btn-reset-submit"
                        class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-blue-medium hover:bg-navy focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-medium transition-all duration-300">
                        Atualizar Senha e Entrar
                    </button>
                </div>
            </form>

        </div>
    </div>

    <!-- Footer -->
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center text-xs text-gray-400 mt-8">
        <p>&copy; 2026 Dr. Gustavo Sisant. Todos os direitos reservados.</p>
        <p class="mt-1"><a href="/" class="hover:text-navy hover:underline">Voltar para a página principal</a></p>
    </div>

    <!-- App Script -->
    <script type="module" src="./auth.js"></script>
</body>

</html>
